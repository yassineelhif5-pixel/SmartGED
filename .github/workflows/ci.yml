name: CI
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: documind, POSTGRES_PASSWORD: documind, POSTGRES_DB: documind_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U documind" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high

  images:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t documind-api ./backend && docker build -t documind-web ./frontend
      - name: Scan images
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: documind-api, severity: "CRITICAL,HIGH", exit-code: "0" }
